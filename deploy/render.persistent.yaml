# REVIEWABLE TEMPLATE ONLY. Applying this file provisions paid compute and disk.
# Confirm the account, service, current price and ledger migration first.
# Update the EXISTING Blueprint, never create a second budget-bearing service.
services:
  - type: web
    name: aws-playground-review
    runtime: node
    plan: 0.5c-512mb
    repo: https://github.com/thphuc06/aws_playground
    branch: main
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: review-budget
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: REVIEW_ENABLED
        sync: false
      - key: REVIEW_PERSISTENT_DISK_CONFIRMED
        sync: false
      - key: REVIEW_ALLOWED_ORIGINS
        value: https://aws-developer-playground-phuc.pointykayak.chatgpt.site
      - key: REVIEW_MODEL
        value: gpt-5.4-mini-2026-03-17
      - key: REVIEW_BUDGET_USD
        value: '1'
      - key: REVIEW_LEDGER_PATH
        value: /var/data/architecture-review-ledger.json
      - key: OPENAI_API_KEY
        sync: false
      - key: REVIEW_ACCESS_TOKEN
        sync: false
