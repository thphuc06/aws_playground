# Free compute, no disk, no dollar cap. Workflow/rate/token limits still apply.
# Enter the backend OpenAI key privately. Review endpoints have no authentication.
services:
  - type: web
    name: aws-playground-review
    runtime: node
    plan: free
    repo: https://github.com/thphuc06/aws_playground
    branch: main
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: REVIEW_ENABLED
        value: 'true'
      - key: OPENAI_API_KEY
        sync: false
      - key: REVIEW_ALLOWED_ORIGINS
        value: https://aws-developer-playground-phuc.pointykayak.chatgpt.site
      - key: REVIEW_RENDER_FRONTEND_ORIGIN
        fromService:
          type: web
          name: aws-playground-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REVIEW_MODEL
        value: gpt-6.1-terra
      - key: REVIEW_REASONING_EFFORT
        value: 'medium'
      - key: REVIEW_PLANNER_REASONING_EFFORT
        value: 'low'
      - key: REVIEW_PLANNER_MAX_RESPONSES
        value: '8'
      - key: REVIEW_MAX_RESPONSES
        value: '32'
      - key: REVIEW_MAX_TOOL_CALLS
        value: '100'
      - key: REVIEW_MAX_SEARCHES
        value: '6'
      - key: REVIEW_MAX_OUTPUT_TOKENS
        value: '12288'
      - key: REVIEW_TIMEOUT_SECONDS
        value: '1200'
  - type: web
    name: aws-playground-frontend
    runtime: static
    repo: https://github.com/thphuc06/aws_playground
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '22'
