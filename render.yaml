# Free compute, no disk. The memory budget resets on restart/deploy.
# Enter the two secrets privately; review stays disabled if either is missing.
services:
  - type: web
    name: aws-playground-review
    runtime: node
    plan: free
    repo: https://github.com/thphuc06/aws_playground
    branch: main
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: REVIEW_ENABLED
        value: 'true'
      - key: OPENAI_API_KEY
        sync: false
      - key: REVIEW_ACCESS_TOKEN
        sync: false
      - key: REVIEW_ALLOWED_ORIGINS
        value: https://aws-developer-playground-phuc.pointykayak.chatgpt.site
      - key: REVIEW_MODEL
        value: gpt-5.4-mini-2026-03-17
      - key: REVIEW_BUDGET_USD
        value: '1'
